block.metrum-war-reconstructor.description = Ostateczny rekonstruktor: B -> C i C -> D. Koszt bazowy 1 skrzynka amunicji + 2 stal + 0,09 pary/s, rośnie x1,5 z każdym poziomem.
block.metrum-ammo-factory.name = Fabryka amunicji
