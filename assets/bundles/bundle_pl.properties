planet.metrum-ferrox.name = Ferrox
planet.metrum-ferrox.description = Spalony, bogaty w żelazo świat. Tutejszy wróg szybko odbudowuje bazy.
unit.metrum-monomet-t1c.name = MonoMet T1C
unit.metrum-monomet-t1c.description = Przebudowany B: większy, wolniejszy, wytrzymalszy, z dodatkową bronią. Rola: zwiadowca-górnik z naprawczymi wyładowaniami. Co 10 s wzmacnia sojuszników w zasięgu 8 kratek (+20% obrażeń i zasięgu) niesionym materiałem (wydobyta ruda też się liczy). Bak 100.
unit.metrum-monomet-t2c.name = MonoMet T2C
unit.metrum-monomet-t2c.description = Przebudowany B: większy, wolniejszy, wytrzymalszy, z dodatkową bronią. Rola: medyk i naprawiacz. Co 10 s wzmacnia sojuszników w zasięgu 10 kratek (+20% obrażeń i zasięgu) niesionym materiałem (wydobyta ruda też się liczy). Bak 200.
unit.metrum-monomet-t3c.name = MonoMet T3C
unit.metrum-monomet-t3c.description = Przebudowany B: większy, wolniejszy, wytrzymalszy, z dodatkową bronią. Rola: kruszarka z rakietami i działkami na bliski dystans. Co 10 s wzmacnia sojuszników w zasięgu 12 kratek (+20% obrażeń i zasięgu) niesionym materiałem (wydobyta ruda też się liczy). Bak 250. Uzbrojenie: laser ogniowy (po 2 s trafienie wybucha ogniem), ciężkie wyrzutnie 2x5 rakiet (30 obr.), boczne torpedy śledzące (300 obr., zasięg 800, co 30 s).
unit.metrum-monomet-t1d.name = MonoMet T1D
unit.metrum-monomet-t1d.description = Przebudowany C: większy, wolniejszy, wytrzymalszy, z dodatkową bronią. Rola: zwiadowca-górnik z naprawczymi wyładowaniami. Co 7,5 s wzmacnia sojuszników w zasięgu 11 kratek (+20% obrażeń i zasięgu) niesionym materiałem (wydobyta ruda też się liczy). Bak 100. Błyskawice łańcuchowe: wyładowania przeskakują między murami i jednostkami (do 4 skoków), po drodze naprawiając własne bloki.
unit.metrum-monomet-t2d.name = MonoMet T2D
unit.metrum-monomet-t2d.description = Przebudowany C: większy, wolniejszy, wytrzymalszy, z dodatkową bronią. Rola: medyk i naprawiacz. Co 7,5 s wzmacnia sojuszników w zasięgu 13 kratek (+20% obrażeń i zasięgu) niesionym materiałem (wydobyta ruda też się liczy). Bak 200.
unit.metrum-monomet-t3d.name = MonoMet T3D
unit.metrum-monomet-t3d.description = Przebudowany C: większy, wolniejszy, wytrzymalszy, z dodatkową bronią. Rola: kruszarka z rakietami i działkami na bliski dystans. Co 7,5 s wzmacnia sojuszników w zasięgu 15 kratek (+20% obrażeń i zasięgu) niesionym materiałem (wydobyta ruda też się liczy). Bak 250. Uzbrojenie: laser ogniowy (po 2 s trafienie wybucha ogniem), ciężkie wyrzutnie 2x5 rakiet (30 obr.), boczne torpedy śledzące (300 obr., zasięg 800, co 30 s).
