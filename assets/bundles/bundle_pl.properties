metrum.welcome.title = Metrum Industry Drones {0}
metrum.welcome.thanks = Dzięki za pobranie Metrum!
metrum.welcome.changes = Co nowego:
metrum.changelog = - Tarcze z odpornościami (nowa biblioteka tarcz): blokują wybuchy i pociski fizyczne, lasery/miotacze/żużel/trucizny przechodzą\n- 3D: generator tarczy 500 HP (100% wybuchy, 60% fizyczne, regeneracja 2/s, 60 s przerwy po zniszczeniu)\n- 1C/1D: mini-tarcza 150 HP; 1D dostaje też ciężkie wyrzutnie z 3D\n- 2C/2D: tarcza pancerza 100 HP: +15 pancerza i 50% odporności na podpalenie, dopóki działa\n- Każdy wariant D: czerwony gigalaser - 250 obrażeń co 0,33 s przez 2,5 s
