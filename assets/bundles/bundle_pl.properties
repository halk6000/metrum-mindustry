metrum.welcome.title = Metrum Industry Drones {0}
metrum.welcome.thanks = Dzięki za pobranie Metrum!
metrum.welcome.changes = Co nowego:
metrum.changelog = - Przeniesienie do Javy (Mindustry 160)\n- Rekonstruktor Wojenny: ostateczna przebudowa B -> C -> D, koszt x1,5 na poziom\n- Drony C/D wzmacniają sojuszników (+20% obrażeń i zasięgu) i mają bak paliwa\n- Stacje paliw (żużel / magma / plazma), falownik cieplny, fabryka amunicji\n- Atomizer + zderzacz hadronów, działo kwarkowe, wiertło i ściany z karborundu\n- Nowa planeta Ferrox z mądrzejszym wrogiem rozbudowującym bazę
metrum.welcome.support = Jeśli chcecie mnie wspierać, zajrzyjcie na mojego GitHuba (halk6000) i akinoxmusic.pl, gdzie są moje projekty.
