block.metrum-stream-drill-t1.name = Wiertło parowe
block.metrum-stream-drill-t1.description = Wiertło promieniowe o niskim poborze prądu. Para daje małe przyspieszenie.
block.metrum-stream-drill-t1-adv.name = Zaawansowane wiertło parowe
block.metrum-stream-drill-t1-adv.description = Szybsze i wydobywa twardsze surowce. Zużywa więcej prądu.
block.metrum-stream-drill-t2.name = Wiertło parowe z doładowaniem
block.metrum-stream-drill-t2.description = Zużywa więcej pary dla mocniejszego przyspieszenia.
block.metrum-stream-drill-t2-adv.name = Zaawansowane wiertło z doładowaniem
block.metrum-stream-drill-t2-adv.description = Spala dużo pary, by kopać nawet 3x szybciej.
block.metrum-rock-scraper.name = Zdzierak skał
block.metrum-rock-scraper.description = Zeskrobuje odłamki skały ze ścian piaskowych.

block.metrum-graphite-decompressor.name = Dekompresor grafitu
block.metrum-graphite-decompressor.description = Rozkłada grafit z powrotem na węgiel.
block.metrum-graphite-decompressor-overclocked.name = Podkręcony dekompresor grafitu
block.metrum-graphite-decompressor-overclocked.description = Rozkłada grafit na węgiel znacznie wydajniej.
block.metrum-steam-furnace.name = Piec parowy
block.metrum-steam-furnace.description = Spala węgiel, gotując wodę na parę.
block.metrum-large-steam-furnace.name = Duży piec parowy
block.metrum-large-steam-furnace.description = Większy i bardziej żarłoczny piec, daje dużo więcej pary.
block.metrum-heat-inverter.name = Falownik cieplny
block.metrum-heat-inverter.description = Przyjmuje ciepło z grzałek i zamienia nim wodę w parę. Nadmiar ciepła go przyspiesza.
block.metrum-stone-crusher.name = Kruszarka
block.metrum-stone-crusher.description = Kruszy odłamki skały na piasek przy użyciu wody.
block.metrum-infusion-smelter.name = Huta infuzyjna
block.metrum-infusion-smelter.description = Wytapia stal z żelaza i węgla, używając pary.
block.metrum-salvager.name = Odzyskiwacz
block.metrum-salvager.description = Odzyskuje żelazo i piasek z odłamków skały.
block.metrum-turbine-advanced.name = Zaawansowana turbina
block.metrum-turbine-advanced.description = Stawiana na kominach parowych. Bez dostarczanej pary pracuje na 75%, z parą na 100% i skrapla trochę wody.
block.metrum-air-miner-dock.name = Dok dronów wydobywczych
block.metrum-air-miner-dock.description = Centralny punkt operacji wydobywczych. Produkuje drony MonoMet.
block.metrum-air-miner-rebuilder.name = Przebudowa dronów wydobywczych
block.metrum-air-miner-rebuilder.description = Ulepsza drony MonoMet do wariantów B.

unit.metrum-monomet-t1.name = MonoMet T1
unit.metrum-monomet-t1.description = Podstawowa jednostka wydobywcza.
unit.metrum-monomet-t1b.name = MonoMet T1B
unit.metrum-monomet-t1b.description = Przebudowany T1: szybszy, z leczącą strzelbą łukową.
unit.metrum-monomet-t2.name = MonoMet T2
unit.metrum-monomet-t2.description = Lepszy laser wydobywczy i mobilność oraz działko naprawcze.
unit.metrum-monomet-t2b.name = MonoMet T2B
unit.metrum-monomet-t2b.description = Przebudowany T2 z większym zdrowiem i szybszymi naprawami.
unit.metrum-monomet-t3.name = MonoMet T3
unit.metrum-monomet-t3.description = Większy brat: ogromna ładowność, słabsza mobilność, wyrzutnie rakiet.
unit.metrum-monomet-t3b.name = MonoMet T3B
unit.metrum-monomet-t3b.description = Ciężki przebudowany T3 z potężnymi rakietami dalekiego zasięgu, ale wolny i łatwy do trafienia.

