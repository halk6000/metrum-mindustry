block.metrum-atomizer.description = Rozbija minerały na formę atomową (2 -> 1). Zasila zderzacz hadronów.
item.metrum-carborundum.name = Karborund
item.metrum-carborundum.description = Węglik krzemu. Niezwykle twarde kryształy.
item.metrum-tungsten-carbide.name = Węglik wolframu
item.metrum-tungsten-carbide.description = Ultragęsty materiał pancerny.
item.metrum-beryllium-bronze.name = Brąz berylowy
item.metrum-beryllium-bronze.description = Nieiskrzący, sprężysty stop.
item.metrum-ferrotungsten.name = Żelazowolfram
item.metrum-ferrotungsten.description = Ciężki stop dla zaawansowanych maszyn.
item.metrum-quark-matter.name = Materia kwarkowa
item.metrum-quark-matter.description = Egzotyczna materia ze zderzenia toru z torem. Obchodzić się z... wszystkim.
block.metrum-hadron-collider.name = Zderzacz hadronów
block.metrum-hadron-collider.description = Zderza ze sobą dwa rodzaje atomów. To, jaką parę dostarczysz, decyduje o produkcie.
status.metrum-out-of-fuel.name = Brak paliwa
status.metrum-out-of-fuel.description = Pusty bak: -90% prędkości ruchu. Leć do stacji paliw.
block.metrum-fuel-station.name = Stacja paliw
block.metrum-fuel-station.description = Pasywnie tankuje sojusznicze jednostki w wariancie C/D w zasięgu 8 kratek. Żużel daje +10% prędkości, magma +30%, plazma +50%.
liquid.metrum-magma.name = Magma
liquid.metrum-magma.description = Stopiona skała. Dobre paliwo: +30% prędkości jednostek.
liquid.metrum-plasma.name = Plazma
liquid.metrum-plasma.description = Zjonizowany gaz. Najlepsze paliwo: +50% prędkości jednostek.
status.metrum-fuel-slag.name = Paliwo z żużlu
status.metrum-fuel-magma.name = Paliwo z magmy
status.metrum-fuel-plasma.name = Paliwo z plazmy
block.metrum-magma-forge.name = Kuźnia magmy
block.metrum-magma-forge.description = Topi odłamki skały w magmę przy użyciu ciepła. Nadmiar ciepła ją przyspiesza.
block.metrum-plasma-ionizer.name = Jonizator plazmy
block.metrum-plasma-ionizer.description = Jonizuje magmę z atomowym węglem i dużą ilością prądu, tworząc plazmę.
status.metrum-boosted.name = Wzmocniony
status.metrum-boosted.description = +20% obrażeń i zasięgu.
planet.metrum-ferrox.name = Ferrox
planet.metrum-ferrox.description = Spalony, bogaty w żelazo świat. Tutejszy wróg szybko odbudowuje bazy.
block.metrum-booster-rebuilder.name = Przebudowa wzmacniaczy
block.metrum-booster-rebuilder.description = Ulepsza drony MonoMet B do wariantów C - wzmacniaczy.
unit.metrum-monomet-t1c.name = MonoMet T1C
unit.metrum-monomet-t1c.description = Wzmacniacz: co 10 s daje sojusznikom w zasięgu 8 kratek +20% obrażeń i zasięgu, płacąc 20 najsłabszego materiału (o 2 mniej za każdy bardziej zaawansowany). Uzupełnia z rdzenia. Ma bak paliwa (100).
unit.metrum-monomet-t2c.name = MonoMet T2C
unit.metrum-monomet-t2c.description = Wzmacniacz: co 10 s daje sojusznikom w zasięgu 10 kratek +20% obrażeń i zasięgu, płacąc 20 najsłabszego materiału (o 2 mniej za każdy bardziej zaawansowany). Uzupełnia z rdzenia. Ma bak paliwa (200).
unit.metrum-monomet-t3c.name = MonoMet T3C
unit.metrum-monomet-t3c.description = Wzmacniacz: co 10 s daje sojusznikom w zasięgu 12 kratek +20% obrażeń i zasięgu, płacąc 20 najsłabszego materiału (o 2 mniej za każdy bardziej zaawansowany). Uzupełnia z rdzenia. Ma bak paliwa (250).
block.metrum-booster-rebuilder-d.name = Zaawansowana przebudowa wzmacniaczy
block.metrum-booster-rebuilder-d.description = Ulepsza wzmacniacze C do wariantów D. Zasilana plazmą.
unit.metrum-monomet-t1d.name = MonoMet T1D
unit.metrum-monomet-t1d.description = Zaawansowany wzmacniacz: co 7,5 s daje sojusznikom w zasięgu 11 kratek +20% obrażeń i zasięgu. Bak 100.
unit.metrum-monomet-t2d.name = MonoMet T2D
unit.metrum-monomet-t2d.description = Zaawansowany wzmacniacz: co 7,5 s daje sojusznikom w zasięgu 13 kratek +20% obrażeń i zasięgu. Bak 200.
unit.metrum-monomet-t3d.name = MonoMet T3D
unit.metrum-monomet-t3d.description = Zaawansowany wzmacniacz: co 7,5 s daje sojusznikom w zasięgu 15 kratek +20% obrażeń i zasięgu. Bak 250.
