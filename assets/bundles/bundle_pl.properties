item.metrum-quark-matter.description = Egzotyczna materia ze zderzenia toru z torem. Obchodzić się z... wszystkim.
block.metrum-hadron-collider.name = Zderzacz hadronów
block.metrum-hadron-collider.description = Zderza dwa rodzaje atomów; para decyduje o produkcie.\nWęgiel + Krzem -> Karborund\nWolfram + Węgiel -> Węglik wolframu\nBeryl + Żelazo -> Brąz berylowy x2\nŻelazo + Wolfram -> Żelazowolfram\nTor + Tor -> Materia kwarkowa
status.metrum-out-of-fuel.name = Brak paliwa
