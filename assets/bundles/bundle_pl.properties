block.metrum-quark-cannon.name = Działo kwarkowe
block.metrum-quark-cannon.description = Wieżyczka końcowa. Brąz berylowy: szybkie przebijające pociski; materia kwarkowa: wolna kula z niszczycielskim wybuchem, który topi cele.
