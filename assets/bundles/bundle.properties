block.metrum-hull-gun-turret.name = Hull Gun Turret
block.metrum-hull-gun-turret.description = A medium hull with a machine gun, made into a turret. Uses 1 ammo crate per shot. C-variant drones and above can lift and move it.
block.metrum-hull-missile-turret.name = Hull Missile Turret
block.metrum-hull-missile-turret.description = A medium hull with a missile pod. Uses 1 ammo crate per salvo. C-variant drones and above can lift and move it.
