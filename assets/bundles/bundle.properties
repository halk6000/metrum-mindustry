block.metrum-fusion-reactor.name = Fusion Reactor
block.metrum-fusion-reactor.description = Fuses quark matter the way stars do. At 100%: 9000 power/s, heat and steam, but needs 90 water/s.\nAt 100% it also fuses atoms into heavier ones: Be -> C -> Si -> Ti -> Fe -> Cu -> W -> Pb -> Th.\nNo coolant for 5 s: it glows red. After 30 more seconds it explodes (50 tiles, 1500 damage).
metrum.reactor.output = Output {0}%
metrum.reactor.meltdown = Meltdown risk
block.metrum-decay-reactor.name = Decay Reactor
block.metrum-decay-reactor.description = Lets thorium decay safely: 3000 power/s and no explosion risk.\nEach decay (10 s) drops 3 random resources. Feed it quark matter instead: still 1 per decay, but 3x the resources - and sometimes it drops quark matter back, sustaining the reaction.
