metrum.changelog = - Ported to Java (Mindustry 160)\n- War Reconstructor: the final rebuild B -> C -> D, cost x1.5 per level\n- C/D drones boost allies (+20% damage and range) and carry a fuel tank\n- Fuel stations (slag / magma / plasma), heat inverter, ammo factory\n- Atomizer + Hadron Collider, quark cannon, carborundum bore and walls\n- New planet Ferrox with a smarter, base-building enemy
