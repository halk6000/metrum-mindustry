block.metrum-steam-engine.name = Steam Engine
block.metrum-steam-engine.description = Burns steam into 600 power/s. Spins up in steps (heat 3 -> 6 -> 9 -> 12) and passes heat to every adjacent block that needs it (no facing needed).
sector.metrum-old-ravine.name = Old Ravine
sector.metrum-old-ravine.description = We drifted far from Ekler. In Old Ravine, we discovered a new drone type whose blueprints Command wants to recover. Their owners will not surrender them without a fight.\n\n[accent]Objective:[] destroy the enemy core and secure the area to recover the blueprints.
