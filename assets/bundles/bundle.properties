item.metrum-atomic-thorium.description = Stripped-down atoms, ready for the hadron collider.
block.metrum-atomizer.name = Atomizer
block.metrum-atomizer.description = Breaks minerals down into atoms (2 -> 1).\nGraphite -> Atomic Carbon\nSilicon -> Atomic Silicon\nBeryllium -> Atomic Beryllium\nIron -> Atomic Iron\nTungsten -> Atomic Tungsten\nThorium -> Atomic Thorium
item.metrum-carborundum.name = Carborundum
item.metrum-carborundum.description = Silicon carbide. Extremely hard crystals.
item.metrum-tungsten-carbide.name = Tungsten Carbide
item.metrum-tungsten-carbide.description = Ultra-dense armour material.
item.metrum-beryllium-bronze.name = Beryllium Bronze
item.metrum-beryllium-bronze.description = Spark-proof, springy alloy.
item.metrum-ferrotungsten.name = Ferrotungsten
item.metrum-ferrotungsten.description = Heavy alloy for advanced machinery.
item.metrum-quark-matter.name = Quark Matter
item.metrum-quark-matter.description = Exotic matter from colliding thorium with itself. Handle with... everything.
block.metrum-hadron-collider.name = Hadron Collider
block.metrum-hadron-collider.description = Smashes two kinds of atoms together; the pair decides the product.\nCarbon + Silicon -> Carborundum\nTungsten + Carbon -> Tungsten Carbide\nBeryllium + Iron -> Beryllium Bronze x2\nIron + Tungsten -> Ferrotungsten\nThorium + Thorium -> Quark Matter
status.metrum-out-of-fuel.name = Out of Fuel
status.metrum-out-of-fuel.description = Empty fuel tank: -90% movement speed. Get to a fuel station.
block.metrum-fuel-station.name = Fuel Station
block.metrum-fuel-station.description = Passively refuels friendly C/D-variant units within 8 tiles. Slag gives +10% speed, magma +30%, plasma +50%.
liquid.metrum-magma.name = Magma
liquid.metrum-magma.description = Molten rock. Good fuel: +30% unit speed.
liquid.metrum-plasma.name = Plasma
liquid.metrum-plasma.description = Ionised gas. Best fuel: +50% unit speed.
status.metrum-fuel-slag.name = Slag Fuel
status.metrum-fuel-magma.name = Magma Fuel
status.metrum-fuel-plasma.name = Plasma Fuel
block.metrum-magma-forge.name = Magma Forge
block.metrum-magma-forge.description = Melts Piece Rock into magma using heat. Extra heat speeds it up.
block.metrum-plasma-ionizer.name = Plasma Ionizer
block.metrum-plasma-ionizer.description = Ionises magma with atomic carbon and lots of power into plasma.
status.metrum-boosted.name = Boosted
status.metrum-boosted.description = +20% damage and range.
planet.metrum-ferrox.name = Ferrox
planet.metrum-ferrox.description = A scorched, iron-rich world. The local enemy rebuilds its bases fast.
unit.metrum-monomet-t1c.name = MonoMet T1C
unit.metrum-monomet-t1c.description = Rebuilt B: bigger, slower, tougher, one more weapon. Role: scout miner with repair arcs. Every 10 s boosts allies within 8 tiles (+20% damage and range) using carried material (mined ore counts). Fuel tank 100.
unit.metrum-monomet-t2c.name = MonoMet T2C
unit.metrum-monomet-t2c.description = Rebuilt B: bigger, slower, tougher, one more weapon. Role: healer and repairer. Every 10 s boosts allies within 10 tiles (+20% damage and range) using carried material (mined ore counts). Fuel tank 200.
unit.metrum-monomet-t3c.name = MonoMet T3C
unit.metrum-monomet-t3c.description = Rebuilt B: bigger, slower, tougher, one more weapon. Role: missile crusher with close-range guns. Every 10 s boosts allies within 12 tiles (+20% damage and range) using carried material (mined ore counts). Fuel tank 250. Weapons: fire laser (hits burst into flames 2 s later), heavy 2x5 missile pods (30 dmg), side homing torpedoes (300 dmg, range 800, every 30 s).
unit.metrum-monomet-t1d.name = MonoMet T1D
unit.metrum-monomet-t1d.description = Rebuilt C: bigger, slower, tougher, one more weapon. Role: scout miner with repair arcs. Every 7.5 s boosts allies within 11 tiles (+20% damage and range) using carried material (mined ore counts). Fuel tank 100. Chain lightning: its arcs jump between walls and units (up to 4 jumps), repairing friendly blocks on the way.
unit.metrum-monomet-t2d.name = MonoMet T2D
unit.metrum-monomet-t2d.description = Rebuilt C: bigger, slower, tougher, one more weapon. Role: healer and repairer. Every 7.5 s boosts allies within 13 tiles (+20% damage and range) using carried material (mined ore counts). Fuel tank 200.
unit.metrum-monomet-t3d.name = MonoMet T3D
unit.metrum-monomet-t3d.description = Rebuilt C: bigger, slower, tougher, one more weapon. Role: missile crusher with close-range guns. Every 7.5 s boosts allies within 15 tiles (+20% damage and range) using carried material (mined ore counts). Fuel tank 250. Weapons: fire laser (hits burst into flames 2 s later), heavy 2x5 missile pods (30 dmg), side homing torpedoes (300 dmg, range 800, every 30 s).
block.metrum-ore-iron.name = Iron Ore
block.metrum-ore-iron.description = Iron deposits common on Ferrox.
block.metrum-war-reconstructor.name = War Reconstructor
block.metrum-war-reconstructor.description = The final reconstructor: B -> C and C -> D. Base cost 1 ammo crate + 2 steel + 0.09 steam/s, growing x1.5 per upgrade level.
block.metrum-ammo-factory.name = Ammo Factory
block.metrum-ammo-factory.description = 2 iron + 1 steel + 3 beryllium + water -> 2 ammo crates. Releases steam as a by-product.
item.metrum-ammo-crate.name = Ammo Crate
item.metrum-ammo-crate.description = Packed ammunition. Required to build C-variant war drones.
