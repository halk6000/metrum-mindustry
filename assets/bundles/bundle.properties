# Metrum - English (default)
item.metrum-piece-rock.name = Piece Rock
item.metrum-piece-rock.description = A strong rock fragment scraped from cliffs.
item.metrum-iron.name = Iron
item.metrum-iron.description = Plain iron. Fe. Nothing fancy.
item.metrum-steel.name = Steel
item.metrum-steel.description = Iron infused with a little coal.
item.metrum-weapon-part.name = Weapon Part
item.metrum-weapon-part.description = Packed weapon components.
item.metrum-advanced-weapon-part.name = Advanced Weapon Part
item.metrum-advanced-weapon-part.description = Precision weapon components for serious drones.
liquid.metrum-steam.name = Steam
liquid.metrum-steam.description = Hot water vapour. Be careful, okay?

block.metrum-stream-drill-t1.name = Steam Bore
block.metrum-stream-drill-t1.description = Low power beam drill. Steam gives a small boost.
block.metrum-stream-drill-t1-adv.name = Advanced Steam Bore
block.metrum-stream-drill-t1-adv.description = Faster and able to mine harder materials. Uses more power.
block.metrum-stream-drill-t2.name = Steam Booster Bore
block.metrum-stream-drill-t2.description = Uses more steam for a stronger boost.
block.metrum-stream-drill-t2-adv.name = Advanced Steam Booster Bore
block.metrum-stream-drill-t2-adv.description = Burns lots of steam to dig up to 3x faster.
block.metrum-rock-scraper.name = Rock Scraper
block.metrum-rock-scraper.description = Scrapes Piece Rock from sand walls.

block.metrum-graphite-decompressor.name = Graphite Decompressor
block.metrum-graphite-decompressor.description = Decompresses graphite back into coal.
block.metrum-graphite-decompressor-overclocked.name = Overclocked Graphite Decompressor
block.metrum-graphite-decompressor-overclocked.description = Decompresses graphite into coal much more efficiently.
block.metrum-steam-furnace.name = Steam Furnace
block.metrum-steam-furnace.description = Burns coal to boil water into steam.
block.metrum-large-steam-furnace.name = Large Steam Furnace
block.metrum-large-steam-furnace.description = A bigger, hungrier furnace producing far more steam.
block.metrum-heat-inverter.name = Heat Inverter
block.metrum-heat-inverter.description = Accepts heat from heaters and uses it to boil water into steam. Excess heat speeds it up.
block.metrum-stone-crusher.name = Stone Crusher
block.metrum-stone-crusher.description = Crushes Piece Rock into sand using water.
block.metrum-infusion-smelter.name = Infusion Smelter
block.metrum-infusion-smelter.description = Smelts iron with coal into steel, using steam.
block.metrum-salvager.name = Salvager
block.metrum-salvager.description = Salvages iron and sand out of Piece Rock.
block.metrum-turbine-advanced.name = Advanced Turbine
block.metrum-turbine-advanced.description = Placed on steam vents. Runs at 75% without supplied steam, 100% with it, and condenses some water.
block.metrum-air-miner-dock.name = Air Miner Dock
block.metrum-air-miner-dock.description = A central hub for mining operations. Produces MonoMet mining drones.
block.metrum-air-miner-rebuilder.name = Air Miner Rebuilder
block.metrum-air-miner-rebuilder.description = Upgrades MonoMet drones into their B variants.

unit.metrum-monomet-t1.name = MonoMet T1
unit.metrum-monomet-t1.description = Basic extraction unit.
unit.metrum-monomet-t1b.name = MonoMet T1B
unit.metrum-monomet-t1b.description = Rebuilt T1: faster, with a healing arc shotgun.
unit.metrum-monomet-t2.name = MonoMet T2
unit.metrum-monomet-t2.description = Better mining laser and mobility, plus a repair cannon.
unit.metrum-monomet-t2b.name = MonoMet T2B
unit.metrum-monomet-t2b.description = Rebuilt T2 with more health and faster repairs.
unit.metrum-monomet-t3.name = MonoMet T3
unit.metrum-monomet-t3.description = The big brother: huge cargo, weaker mobility, rocket launchers.
unit.metrum-monomet-t3b.name = MonoMet T3B
unit.metrum-monomet-t3b.description = Heavy rebuilt T3 with powerful long range rockets, but slow and easy to hit.

