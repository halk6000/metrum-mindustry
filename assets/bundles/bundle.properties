metrum.welcome.thanks = Thanks for downloading Metrum!
metrum.welcome.changes = What's new:
metrum.changelog = - Planet difficulty (Settings -> Metrum): spreads AI levels over Ferrox sectors\n- Enemy constructor drones: hand over build queues to replacements, mine when idle, release reserved materials\n- Enemy AI expands condensers when short on water and uses Metrum drills for missing resources\n- Old Ravine: updated hand-made map
