item.metrum-atomic-beryllium.description = Stripped-down atoms, ready for the hadron collider.
item.metrum-atomic-iron.name = Atomic Iron
item.metrum-atomic-iron.description = Stripped-down atoms, ready for the hadron collider.
item.metrum-atomic-tungsten.name = Atomic Tungsten
item.metrum-atomic-tungsten.description = Stripped-down atoms, ready for the hadron collider.
