block.metrum-de-atomizer.name = De-Atomizer
block.metrum-de-atomizer.description = Turns atoms back into their material (1 atom -> 1 item): graphite, silicon, beryllium, iron, tungsten, thorium, copper, lead, titanium.
block.metrum-reaction-control.name = Reaction Control Panel
block.metrum-reaction-control.description = Place next to a Fusion Reactor and pick the reaction target. The reactor fuses atoms only up to that element; the panel takes the finished atoms out.
block.metrum-salvager-overclocked.name = Overclocked Salvager
block.metrum-salvager-overclocked.description = Same speed as the Salvager. Yields 2 iron (80%) or 1 sand (20%) per roll.
block.metrum-salvager-advanced.name = Advanced Salvager
block.metrum-salvager-advanced.description = Also recovers beryllium and tungsten: iron 60%, sand 20%, beryllium 15%, tungsten 5%.
block.metrum-arc-furnace-overclocked.name = Overclocked Silicon Arc Furnace
block.metrum-arc-furnace-overclocked.description = 1 graphite + 2 sand -> 6 silicon in 95% of the normal time, 450 power/s. Atomic carbon as a booster doubles it to 12 silicon per cycle.
command.metrum-caretaker = Take care
block.metrum-color-bridge.name = Circuit Bridge
block.metrum-color-bridge.description = Duct bridge with a circuit colour (click to pick). It links only to the next bridge of the same colour, so parallel lines don't merge and clog.
block.metrum-drop-pod-launcher.name = Drop Pod Launcher
block.metrum-drop-pod-launcher.description = Load units (up to 6), pick one of your sectors with a core (any planet) and launch. Draws 1500 power/s for 15 s - the rest of the base may stall. The pod lands near that core when you next open the sector.
