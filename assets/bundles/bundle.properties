block.metrum-tungsten-carbide-wall-large.description = The heaviest armour. Very high health and armour.
block.metrum-quark-cannon.name = Quark Cannon
block.metrum-quark-cannon.description = Endgame turret. Beryllium bronze fires fast piercing slugs; quark matter fires a slow orb with a devastating blast that melts targets.
block.metrum-carborundum-bore.name = Carborundum Bore
block.metrum-carborundum-bore.description = Heavy beam drill that mines every Erekir ore. Carborundum drill bits boost it 3x.
