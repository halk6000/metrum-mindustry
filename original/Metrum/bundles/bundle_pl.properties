block.Metrum.airminerdock.name = Dok Stacji Wydobywczych
block.Metrum.airminerdock.description = Duża, wielofunkcyjna struktura, która służy jako centralny punkt dla operacji wydobywczych. Produkuje wyspecjalizowane jednostki wydobywcze, które mogą pozyskiwać zasoby z różnych lokalizacji.
unit.Metrum.MonoMetT1.name = MonoMetT1
unit.Metrum.MonoMetT2.name = MonoMetT2
unit.Metrum.MonoMetT3.name = MonoMetT3
unit.Metrum.MonoMetT1.description = Podstawowa jednostka wydobywcza
unit.Metrum.MonoMetT2.description = Lepszy laser wydobywczy i mobilność, a także działko naprawcze czynią tę jednostkę wyjątkowo wszechstronną.
unit.Metrum.MonoMetT3.description = Większy brat, większa ładowność kosztem słabszej mobilności i wyrzutni rakiet, co czyni go również odpowiednim do walki.
