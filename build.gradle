apply plugin: 'java'
version = '2.0.0'
ext.mindustryVersion = 'v146'
repositories {
    mavenCentral()
    maven { url 'https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository' }
    maven { url 'https://www.jitpack.io' }
}
java { sourceCompatibility = JavaVersion.VERSION_1_8; targetCompatibility = JavaVersion.VERSION_1_8 }
sourceSets.main.java.srcDirs = ['src']
// Compile against the installed game (build 160.8) so the API matches exactly.
// Override with -PmindustryJar=path or env MINDUSTRY_JAR.
def gameJar = project.findProperty('mindustryJar') ?: System.getenv('MINDUSTRY_JAR') ?:
    'C:/Program Files (x86)/Steam/steamapps/common/Mindustry/jre/desktop.jar'
dependencies {
    compileOnly files(gameJar)
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs << '-Xlint:-options' }
jar {
    archiveFileName = "${rootProject.name}.jar"
    from(rootDir) { include 'mod.hjson', 'icon.png' }
    from('assets/') { include '**' }
}
