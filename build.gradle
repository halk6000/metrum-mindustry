apply plugin: 'java'
version = '2.6.0'
ext.mindustryVersion = 'v146'
repositories {
    mavenCentral()
    maven { url 'https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository' }
    maven { url 'https://www.jitpack.io' }
}
java { sourceCompatibility = JavaVersion.VERSION_1_8; targetCompatibility = JavaVersion.VERSION_1_8 }
sourceSets.main.java.srcDirs = ['src']
// Compile against the installed game (build 160.8) so the API matches exactly.
// Override with -PmindustryJar=path or env MINDUSTRY_JAR.
def gameJar = project.findProperty('mindustryJar') ?: System.getenv('MINDUSTRY_JAR') ?:
    'C:/Program Files (x86)/Steam/steamapps/common/Mindustry/jre/desktop.jar'
dependencies {
    compileOnly files(gameJar)
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs << '-Xlint:-options' }
jar {
    archiveFileName = "${rootProject.name}.jar"
    from(rootDir) { include 'mod.hjson', 'icon.png' }
    from('assets/') { include '**' }
}

// Static check: every content name has a sprite and EN/PL bundle entries
tasks.register('contentCheck', Exec) {
    commandLine 'python', 'tools/check.py'
}
jar.dependsOn contentCheck

// Run the salvager regression checks against the same game API as the mod.
def compileSalvagerTest = tasks.register('compileSalvagerTest', JavaCompile) {
    dependsOn classes
    source = files('tools/tests/SalvagerOutputTest.java')
    classpath = sourceSets.main.output + files(gameJar)
    destinationDirectory = layout.buildDirectory.dir('salvager-test-classes')
}
tasks.register('salvagerTest', JavaExec) {
    group = 'verification'
    description = 'Checks salvager output, conveyor delivery, consumption and restart.'
    dependsOn compileSalvagerTest
    classpath = files(compileSalvagerTest.flatMap { it.destinationDirectory }) + sourceSets.main.output + files(gameJar)
    mainClass = 'SalvagerOutputTest'
}

// gradlew deploy: build and install into the game (same file name the in-game importer uses)
tasks.register('deploy', Copy) {
    dependsOn jar
    from jar.archiveFile
    into 'C:/Program Files (x86)/Steam/steamapps/common/Mindustry/saves/mods'
    rename { 'Metrum.zip' }
    // Steam Cloud can restore extra copies (e.g. Metrum1.zip from an in-game import): overwrite them too,
    // so whichever one the game picks is the current build.
    doLast {
        def mods = file('C:/Program Files (x86)/Steam/steamapps/common/Mindustry/saves/mods')
        mods.listFiles({ f -> f.name ==~ /Metrum\d*\.zip/ && f.name != 'Metrum.zip' } as FileFilter)?.each { f ->
            java.nio.file.Files.copy(jar.archiveFile.get().asFile.toPath(), f.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}
